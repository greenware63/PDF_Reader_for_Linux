name: Linux CI (Release & Sanitizers)

on:
  push:
    branches: [ main, greenware63-pdf-search-fixes ]
  pull_request:
    branches: [ main, greenware63-pdf-search-fixes ]

jobs:
  build-and-test:
    name: Ubuntu 24.04 (${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, AddressSanitizer, ThreadSanitizer ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - name: Configure CMake (Release)
        if: matrix.build_type == 'Release'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (AddressSanitizer / UndefinedBehaviorSanitizer)
        if: matrix.build_type == 'AddressSanitizer'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Configure CMake (ThreadSanitizer)
        if: matrix.build_type == 'ThreadSanitizer'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build Project
        run: cmake --build build

      - name: Run CTest Test Suite
        env:
          QT_QPA_PLATFORM: "offscreen"
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/ci/tsan_suppressions.txt"
        run: |
          if [ "${{ matrix.build_type }}" = "ThreadSanitizer" ]; then
            # TSan aborts inside its fork handler when Qt launches the sandboxed pdf_worker process
            # (CHECK failed in tsan_rtl.cpp), so only suites that run in a single process go through TSan.
            # The multi-process suites are covered by the Release and ASan/UBSan jobs.
            ctest --test-dir build --output-on-failure -R "EngineRenderTestSuite|DocumentLayoutTestSuite|TileCacheTestSuite"
          else
            ctest --test-dir build --output-on-failure
          fi
